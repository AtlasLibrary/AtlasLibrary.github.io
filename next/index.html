<!doctype html>

<style>
/* Layout: one reading column; catalogue list, then a single book's page with photographs and its description. Read-only. */

  --paper:#F5F7F5; --surface:#FFFFFF; --ink:#1B211E; --muted:#5B6862; --rule:#D9E0DB;

}

:root[data-theme="dark"]{

  --accent:#73B9A5; --accent-ink:#0D1513; --accent-soft:#1D2D28; --gilt:#D3B466; --gilt-soft:#2A2618; color-scheme:dark}
*{box-sizing:border-box}
[hidden]{display:none!important}
body{background:var(--paper);color:var(--ink);font-family:var(--f-ui);font-size:16px;line-height:1.45}
.wrap{max-width:960px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:20px 72px}

:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
h1,h2,h3{text-wrap:balance;margin:0}
h1.brand{display:flex;align-items:center;gap:.5em}

.ctl{background:var(--surface);border:1px solid var(--rule);border-radius:8px;padding:9px 12px;min-height:42px;width:100%}
.list{display:grid;gap:10px}

.list.tiles .row{display:flex;flex-direction:column;align-items:stretch;gap:8px;padding:8px 8px 10px;height:100%}
.list.tiles .twrap{width:100%;height:auto;aspect-ratio:3/4}
.list.tiles .twrap .thumb{width:100%;height:100%}

.back{border:0;background:none;color:var(--accent);font-weight:600;padding:12px 0;min-height:44px}
.bhead{padding-bottom:14px;border-bottom:1px solid var(--rule)}

.tag{display:inline-block;margin-top:10px;background:var(--gilt-soft);color:var(--gilt);font-weight:700;font-size:.75rem;letter-spacing:.05em;text-transform:uppercase;padding:3px 10px;border-radius:99px}

.gate h1 span{color:var(--gilt);font-style:italic}
.gate p{margin:0;color:var(--muted);font-size:.92rem}

.gate .rem{display:flex;gap:8px;align-items:center;justify-content:center;font-size:.88rem;color:var(--muted)}
.gate button{font:inherit;font-weight:700;background:var(--accent);color:var(--accent-ink);border:0;border-radius:8px;min-height:44px;cursor:pointer}

.lockbtn{border:0;background:none;color:var(--muted);font:inherit;font-size:.84rem;text-decoration:underline;cursor:pointer;padding:0;margin-left:8px}
img[data-enc]:not([src]){visibility:hidden}
</style>

</head><body>

<p>Rare books from the collection of Scott W. Atlas</p>
<input type="text" name="username" value="Atlas Library" autocomplete="username" hidden>
<label for="pw" class="sr" style="position:absolute;left:-9999px">Password</label>
<input type="password" id="pw" placeholder="Password" autocomplete="current-password" required>
<label class="rem"><input type="checkbox" id="rem" checked> Remember me on this device</label>
<button type="submit" id="gobtn">Open the catalogue</button>
<div class="err" id="err" role="alert"></div>
</form></div>
<div class="wrap" id="app" hidden>
  <header class="mast">
    <h1 class="brand"><img class="logo" src="../logo.png" alt="" width="96" height="96"><span class="nm">Atlas <span>Library</span></span><span class="newtag">Pro preview</span></h1>
    <p>Rare books from the collection of Scott W. Atlas</p>
  </header>

  <main id="v-list">
    <div class="summary" id="summary"></div>
    <div class="tools">

      <label for="sort">Sort by

</div>
<div class="lightbox" id="lb" hidden role="dialog" aria-label="Photograph">

</div>

function lbShow(){const p=lbList[lbI];$("#lb-img").removeAttribute("src");encSrc($("#lb-img"),p.src);$("#lb-img").alt=p.label||"";$("#lb-cap").textContent=(p.label||"")+"  "+(lbI+1)+" of "+lbList.length;$("#lb-prev").disabled=lbI===0;$("#lb-next").disabled=lbI===lbList.length-1;}
function lbOpen(list,i){lbList=list;lbI=i;lbShow();$("#lb").hidden=false;}
$("#lb-close").onclick=()=>{$("#lb").hidden=true;$("#lb-img").removeAttribute("src");};
$("#lb-prev").onclick=()=>{if(lbI>0){lbI--;lbShow();}};
$("#lb-next").onclick=()=>{if(lbI<lbList.length-1){lbI++;lbShow();}};
document.addEventListener("keydown",e=>{if($("#lb").hidden)return;if(e.key==="Escape")$("#lb-close").onclick();if(e.key==="ArrowLeft")$("#lb-prev").onclick();if(e.key==="ArrowRight")$("#lb-next").onclick();});
function renderBook(b){
  const box=$("#book");box.replaceChildren();
  box.append(el("div",{class:"bhead"},el("div",{class:"who",text:[b.author,b.authorDates?"("+b.authorDates+")":""].filter(Boolean).join(" ")}),el("h2",{text:titleOf(b)}),impLine(b),b.editionStatus?el("span",{class:"tag",text:b.editionStatus}):null));
  if(b.photos&&b.photos.length){const g=el("div",{class:"gallery"});b.photos.forEach((p,i)=>g.append(el("button",{type:"button","aria-label":"Enlarge "+(p.label||"photo"),onclick:()=>lbOpen(b.photos,i)},el("img",{"data-enc":p.thumb,alt:p.label||""}),p.label?el("span",{text:p.label}):null)));box.append(g);}
  for(const[name,fields]of GROUPS){
    const rows=fields.filter(([k])=>b[k]!=null&&String(b[k]).trim()&&!/^unknown$/i.test(String(b[k]).trim()));
    if(!rows.length)continue;
    const dl=el("dl");rows.forEach(([k,l])=>{dl.append(el("dt",{text:l}),el("dd",{class:k==="title"?"t":null,text:String(b[k])}));});
    box.append(el("section",{class:"sect"},el("h3",{text:name}),dl));
  }
}
function route(){
  const m=location.hash.match(/^#book-([a-z0-9]+)$/i); const b=m&&BOOKS.find(x=>x.id===m[1]);
  $("#v-list").hidden=!!b; $("#v-book").hidden=!b;
  if(b){renderBook(b);window.scrollTo(0,0);}else renderList();
}
$("#back").onclick=()=>{location.hash="";};
["input","change"].forEach(ev=>{$("#q").addEventListener(ev,renderList);});
(function(){let v={};try{v=JSON.parse(localStorage.getItem("atlasViewNext")||"{}")}catch(e){}
  $("#sort").value=v.sort&&[...$("#sort").options].some(o=>o.value===v.sort)?v.sort:$("#sort").options[0].value;
  $("#group").value=typeof v.group==="string"&&[...$("#group").options].some(o=>o.value===v.group)?v.group:"author";
  VIEW=v.view==="tiles"?"tiles":"list";})();
function saveView(){try{localStorage.setItem("atlasViewNext",JSON.stringify({sort:$("#sort").value,group:$("#group").value,view:VIEW}))}catch(e){}}
function applyView(){$("#list").classList.toggle("tiles",VIEW==="tiles");document.querySelectorAll(".vsw button").forEach(x=>x.setAttribute("aria-pressed",String(x.dataset.v===VIEW)));}
document.querySelectorAll(".vsw button").forEach(x=>x.addEventListener("click",()=>{VIEW=x.dataset.v;saveView();applyView();if(!$("#v-list").hidden)renderList();}));
let lastCols=0;window.addEventListener("resize",()=>{if(VIEW!=="tiles"||$("#v-list").hidden)return;const c=getComputedStyle($("#list")).gridTemplateColumns.split(" ").length;if(c!==lastCols){lastCols=c;renderList();}});
applyView();
$("#sort").addEventListener("change",()=>{saveView();renderList();});$("#group").addEventListener("change",()=>{saveView();renderList();});
window.addEventListener("hashchange",route);
function start(){$("#gate").hidden=true;$("#app").hidden=false;
  $("#foot").replaceChildren("Catalogue as of "+UPDATED+". "+BOOKS.length+" books.",el("button",{class:"lockbtn",type:"button",onclick:()=>{try{localStorage.removeItem("atlasKey");sessionStorage.removeItem("atlasKey");}catch(e){}location.reload();}},"Lock"));route();}
async function tryStored(){let s=null;try{s=localStorage.getItem("atlasKey")||sessionStorage.getItem("atlasKey");}catch(e){}
  if(!s)return false;try{await loadData(b64d(s));start();return true;}catch(e){try{localStorage.removeItem("atlasKey");sessionStorage.removeItem("atlasKey");}catch(_){}return false;}}
$("#gateform").addEventListener("submit",async e=>{e.preventDefault();const pw=$("#pw").value;$("#err").textContent="";$("#gobtn").disabled=true;$("#gobtn").textContent="Opening…";
  let raw;try{raw=await unwrap(pw);}catch(_){ $("#err").textContent="That password is not right. Please try again.";$("#gobtn").disabled=false;$("#gobtn").textContent="Open the catalogue";return;}
  try{await loadData(raw);}catch(_){ $("#err").textContent="The catalogue could not be loaded. Please reload the page.";$("#gobtn").disabled=false;$("#gobtn").textContent="Open the catalogue";return;}
  try{($("#rem").checked?localStorage:sessionStorage).setItem("atlasKey",b64e(raw));}catch(_){}
  start();});
tryStored().then(ok=>{if(!ok)$("#pw").focus();});
</script>
